<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Ketan Patil engineering system topology</title>
  <desc id="desc">An animated architecture map connecting research, AI, backend, product, data, cloud, security, and verified delivery.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#0b1730"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="390" rx="16" fill="url(#bg)" stroke="#1e3a8a"/>
  <g fill="none" stroke="#1d4ed8" stroke-width="2" stroke-opacity=".62">
    <path d="M180 105H345L420 195"/><path d="M180 285H345L420 195"/><path d="M510 195H690"/><path d="M780 195L855 105H1020"/><path d="M780 195L855 285H1020"/>
  </g>
  <g fill="#38bdf8" filter="url(#g)"><circle r="5"><animateMotion dur="3s" repeatCount="indefinite" path="M180 105H345L420 195"/></circle><circle r="5"><animateMotion dur="3.6s" repeatCount="indefinite" path="M180 285H345L420 195"/></circle><circle r="5"><animateMotion dur="2.2s" repeatCount="indefinite" path="M510 195H690"/></circle><circle r="5"><animateMotion dur="3.2s" repeatCount="indefinite" path="M780 195L855 105H1020"/></circle><circle r="5"><animateMotion dur="3.8s" repeatCount="indefinite" path="M780 195L855 285H1020"/></circle></g>
  <g font-family="Consolas,Menlo,monospace" text-anchor="middle">
    <g transform="translate(60 65)"><rect width="240" height="80" rx="8" fill="#0f172a" stroke="#334155"/><text x="120" y="35" fill="#38bdf8" font-size="14">RESEARCH SIGNAL</text><text x="120" y="58" fill="#64748b" font-size="11">EVIDENCE / EVALUATION</text></g>
    <g transform="translate(60 245)"><rect width="240" height="80" rx="8" fill="#0f172a" stroke="#334155"/><text x="120" y="35" fill="#38bdf8" font-size="14">SECURITY CONTEXT</text><text x="120" y="58" fill="#64748b" font-size="11">THREAT / ACCESS / RISK</text></g>
    <g transform="translate(390 145)"><rect width="150" height="100" rx="12" fill="#172554" stroke="#3b82f6"/><text x="75" y="45" fill="#f8fafc" font-size="16">AI + BACKEND</text><text x="75" y="70" fill="#93c5fd" font-size="11">MODELS / APIs</text></g>
    <g transform="translate(660 145)"><rect width="150" height="100" rx="12" fill="#172554" stroke="#3b82f6"/><text x="75" y="45" fill="#f8fafc" font-size="16">PRODUCT CORE</text><text x="75" y="70" fill="#93c5fd" font-size="11">UX / WORKFLOWS</text></g>
    <g transform="translate(900 65)"><rect width="240" height="80" rx="8" fill="#0f172a" stroke="#334155"/><text x="120" y="35" fill="#f59e0b" font-size="14">CLOUD DELIVERY</text><text x="120" y="58" fill="#64748b" font-size="11">DEPLOY / OBSERVE / SCALE</text></g>
    <g transform="translate(900 245)"><rect width="240" height="80" rx="8" fill="#0f172a" stroke="#334155"/><text x="120" y="35" fill="#f59e0b" font-size="14">VERIFIED OUTCOME</text><text x="120" y="58" fill="#64748b" font-size="11">TEST / MEASURE / PROVE</text></g>
  </g>
</svg>
