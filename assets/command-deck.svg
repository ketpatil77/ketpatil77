<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ketan Patil engineering command deck</title>
  <desc id="desc">Animated science-fiction dashboard header showing Ketan Patil's AI, full-stack, cloud, and security engineering focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset=".55" stop-color="#0b1224"/><stop offset="1" stop-color="#101d3a"/></linearGradient>
    <linearGradient id="rail" x1="0" x2="1"><stop stop-color="#2563eb" stop-opacity="0"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#60a5fa" stroke-opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <path d="M0 42H265L285 22H915L935 42H1200M0 278H265L285 298H915L935 278H1200" fill="none" stroke="#2563eb" stroke-opacity=".55"/>
  <rect x="35" y="70" width="8" height="180" fill="#2563eb"/><rect x="1157" y="70" width="8" height="180" fill="#2563eb"/>
  <g font-family="Consolas,Menlo,monospace">
    <text x="72" y="104" fill="#64748b" font-size="15" letter-spacing="3">ENGINEERING COMMAND DECK / 01</text>
    <text x="70" y="162" fill="#f8fafc" font-size="52" font-weight="700" letter-spacing="2">KETAN PATIL</text>
    <text x="72" y="201" fill="#38bdf8" font-size="20" letter-spacing="2">AI SYSTEMS · PRODUCT ENGINEERING · SECURITY</text>
    <text x="72" y="239" fill="#94a3b8" font-size="15">RESEARCH SIGNALS / PRODUCTION SYSTEMS / VERIFIED DELIVERY</text>
    <g transform="translate(866 85)">
      <rect width="250" height="150" rx="8" fill="#020617" fill-opacity=".55" stroke="#1e40af"/>
      <text x="22" y="31" fill="#64748b" font-size="12" letter-spacing="2">SYSTEM STATUS</text>
      <circle cx="28" cy="60" r="5" fill="#22d3ee" filter="url(#glow)" class="pulse"/><text x="45" y="65" fill="#e2e8f0" font-size="14">PROFILE ONLINE</text>
      <path d="M22 88H228" stroke="#1e293b"/>
      <text x="22" y="112" fill="#64748b" font-size="12">MODE</text><text x="228" y="112" text-anchor="end" fill="#f59e0b" font-size="12">BUILD / TEST / SHIP</text>
      <text x="22" y="136" fill="#64748b" font-size="12">FOCUS</text><text x="228" y="136" text-anchor="end" fill="#38bdf8" font-size="12">HIGH-RELIABILITY</text>
    </g>
  </g>
  <rect x="0" y="55" width="240" height="2" fill="url(#rail)" class="scan"/>
  <style>
    .pulse{animation:pulse 1.8s ease-in-out infinite}.scan{animation:scan 5s linear infinite}@keyframes pulse{50%{opacity:.28}}@keyframes scan{from{transform:translateX(-240px)}to{transform:translateX(1440px)}}
    @media (prefers-reduced-motion:reduce){.pulse,.scan{animation:none}}
  </style>
</svg>
