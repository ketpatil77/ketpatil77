name: Refresh live engineering telemetry

on:
  schedule:
    - cron: "41 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generate telemetry SVG from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/generate_telemetry.py
      - name: Publish telemetry
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/live-telemetry.svg assets/live-telemetry-mobile.svg assets/telemetry.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh live engineering telemetry"
          git push
